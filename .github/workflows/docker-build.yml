# .github/workflows/docker-build.yml

name: Docker Image CI/CD

# Wird bei jedem Push in den main-Branch ausgelöst
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        # Verwendet die GitHub Secrets DOCKER_USERNAME (vagotec) und DOCKER_PASSWORD (PAT)
        username: ${{ secrets.DOCKER_USERNAME }} 
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true 
        # Pusht das Image mit dem Tag 'latest' auf Docker Hub
        tags: vagotec/my-first-fastapi:latest
